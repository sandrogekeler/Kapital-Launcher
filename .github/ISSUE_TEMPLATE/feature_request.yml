# Asks for the problem before the solution, deliberately: the situation is the
# part that can be designed against. The `area` options must stay identical to
# bug_report.yml's.
name: Feature request
description: Suggest something Kapital Launcher should be able to do
title: '[Feature]: '
labels: ['type:feature', 'status:needs-triage']

body:
  - type: markdown
    attributes:
      value: |
        Before writing, it is worth a look at the
        [roadmap](https://github.com/sandrogekeler/Kapital-Launcher/blob/main/agent_docs/ROADMAP.md).
        It lists what is planned and, at the bottom, what is deliberately out of scope.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues and did not find this one
          required: true
        - label: I had a look at the roadmap
          required: false

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation you are in, not the feature you have in mind. This is the most important field on the form.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like the launcher to do?
      description: Your idea for solving it. A rough sketch is fine, and so is "I do not know, but something".
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the launcher?
      description: Pick the closest one. The last option is a perfectly good answer.
      options:
        - Chapters and the chapter page
        - Prism detection and launching
        - Packs and updates
        - Server status and joining
        - Settings
        - Something else, or not sure
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: How do you handle this today?
      description: Whatever you do instead, even if it is "open Prism directly".

  # >>> suite:priority. Vendored from kollektiv by scripts/sync-priority.sh. Edit it there.
  - type: dropdown
    id: priority
    attributes:
      label: How urgent is this for you?
      description: Your honest read. Triage may change it, and that is normal.
      options:
        - 'Blocking: I cannot use it and have no way around it'
        - 'Significant: it costs me real time, but I can work around it'
        - 'Minor: it would be nice, but it is not in my way'
    validations:
      required: true
  # <<< suite:priority

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Sketches, screenshots from other tools, links. Drag images straight into this box.
