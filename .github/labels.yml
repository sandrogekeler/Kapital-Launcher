# The label vocabulary this repo's tooling relies on. A declaration, not a
# mirror: GitHub holds the live state and nothing here syncs to it. It exists
# so the labels the issue forms apply are reviewable in a diff.
#
# Suite-owned (`type:*`, `p0` to `p3`, `changelog:skip`, `blocked`) are copied
# verbatim from kollektiv-mc/Kollektiv's design/labels.json, which is the
# taxonomy every repo in the suite shares. A repo does not invent its own
# type or priority labels. The `area:*`, `milestone:*` and `status:*` labels
# are this repo's own.
#
# Creating them on GitHub is one `gh label create` per entry, or an import of
# this file with a label-sync action. Until that is done, the issue forms
# reference labels GitHub silently ignores.

# Sorts a merged pull request into a release-notes section. Required on every
# pull request by CI's pr-labelled job.
- name: type:feature
  color: bb87fc
  description: 'New capability: the product can now do something it never offered.'
- name: type:bug
  color: eb5757
  description: Existing behavior is wrong. Still a bug when the repair adds new code or new UI.
- name: type:chore
  color: 8792a2
  description: 'No user-visible change: refactors, tests, CI, deps. Counted in the notes, not listed.'
- name: type:docs
  color: 0b84a5
  description: Documentation only. Counted in the release notes, not listed.

# Which part of the launcher. One on every issue and pull request.
- name: area:chapters
  color: aed9e0
  description: The chapter list, hero, panels and the manifest that feeds them.
- name: area:engine
  color: f9e2ae
  description: Prism detection, launch, and the settings that point at it.
- name: area:packs
  color: c5e8b7
  description: Pack sync, packwiz, mrpack import.
- name: area:server
  color: d4c5f9
  description: Server status and joining.
- name: area:tokens
  color: e0aed9
  description: design/tokens.json and everything generated from it.
- name: area:build
  color: f5b7b1
  description: Build, CI, release, dependencies.
- name: area:agents
  color: fef2c0
  description: agent_docs, .claude, suite-kit configuration.

# Priority. Exactly one on every issue; the form's question becomes one of
# p1 to p3 through issue-priority.yml, and p0 is applied by hand.
- name: p0
  color: b60205
  description: Drop everything.
- name: p1
  color: d93f0b
  description: High priority, next up.
- name: p2
  color: fbca04
  description: Medium priority, normal queue.
- name: p3
  color: c2e0c6
  description: Low priority, nice to have.

- name: blocked
  color: 5319e7
  description: Cannot proceed until a stated dependency clears.
- name: changelog:skip
  color: 8792a2
  description: Leave this pull request out of the release notes entirely.

# Triage state. Applied by the forms on creation; moved by hand.
- name: status:needs-triage
  color: ededed
  description: Just filed. Nobody has read it yet.
- name: status:needs-info
  color: fbca04
  description: Waiting on the reporter.
- name: status:confirmed
  color: 0e8a16
  description: Reproduced, or accepted as in scope.

# The question form's label. Deliberately not a type: label, which drives the
# release notes and the pull-request gate; a question belongs in neither.
- name: question
  color: d876e3
  description: Further information is requested.
