# Locked: comes from sandrogekeler/AllesSandro and is re-applied by every
# template update. Change it there, not here; a local edit surfaces as a merge
# conflict on the next update (AllesSandro docs/updating.md).
#
# The language matrix is rendered from this repo's `languages` answer in
# .copier-answers.yml. GitHub Actions workflows are always scanned.
#
# Rendered only when the `public` answer is true: on a private repository code
# scanning needs GitHub Advanced Security, so the analysis would run and its
# upload be refused. Making the repo public is `copier update --data public=true`.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '36 14 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          # The vendored .claude/ runner is Python, so Python is always scanned.
          - language: python
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
