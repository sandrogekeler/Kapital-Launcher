# Locked: comes from sandrogekeler/AllesSandro and is re-applied by every
# template update. Change it there, not here (AllesSandro docs/updating.md).
#
# @claude in an issue, a pull request comment or a review runs Claude Code here
# (https://code.claude.com/docs/en/github-actions). It needs the Claude GitHub
# App on this repo and ONE of these repo secrets, since a personal account has
# no shared secrets:
#   ANTHROPIC_API_KEY        a Claude Console API key, or
#   CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token` (subscription).
# Without either, runs fail at the action step and nothing else is affected.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@86d88e619d8e6caf07b5c3944dd14f441c533718 # v1.0.243
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
