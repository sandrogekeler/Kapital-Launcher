name: Release

# The one place the app is packaged with `wails build`: an NSIS setup for
# Windows and a disk image for macOS (ADR-7), attested and published as a
# GitHub Release (ADR-6). It runs only from the Actions tab, "Run workflow",
# with the version filled in; pull requests and pushes are judged by ci.yml,
# which compiles and tests the Go on both systems. Tick "dry run" to build and
# keep the installers as workflow artefacts without publishing anything.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, X.Y.Z (no leading v)'
        required: true
        type: string
      channel:
        description: 'Channel: beta and alpha are published as prereleases'
        required: true
        type: choice
        default: beta
        options: [beta, alpha, stable]
      number:
        description: 'Prerelease number, the N in beta.N (ignored for stable)'
        required: true
        type: string
        default: '1'
      dry_run:
        description: 'Dry run: build the installers, publish nothing'
        required: true
        type: boolean
        default: false

# A release in flight is not to be cut short by a second one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Fail before any runner time is spent on a version that is wrong or taken.
  # The inputs reach the script through env, never through `${{ }}` in `run:`.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      numeric: ${{ steps.v.outputs.numeric }}
    steps:
      - id: v
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          NUMBER: ${{ inputs.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like 1.2.3."
            exit 1
          fi
          # The tag shape from .claude/rules/builds-and-releases.md:
          # vX.Y.Z, vX.Y.Z-alpha.N or vX.Y.Z-beta.N.
          case "$CHANNEL" in
            stable) tag="v$VERSION" ;;
            alpha | beta)
              if ! [[ "$NUMBER" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error::The prerelease number must be a whole number from 1."
                exit 1
              fi
              tag="v$VERSION-$CHANNEL.$NUMBER"
              ;;
            *) echo "::error::Unknown channel."; exit 1 ;;
          esac
          # `gh release create` would reuse an existing tag and silently release
          # whatever it points at, so a taken tag stops here.
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::The tag $tag already exists."
            exit 1
          fi
          # CFBundleVersion, the Windows version info and the installer want a
          # dotted numeric string, so v0.1.0-beta.1 is 0.1.0 there and stays
          # whole in main.Version.
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "numeric=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $tag" >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.version.outputs.tag }}
      NUMERIC: ${{ needs.version.outputs.numeric }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Built here, frozen, so `wails build -s` below does not run its own
      # unfrozen `pnpm install` from wails.json.
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

      # The CLI at the module's own version: an older CLI rewrites go.mod down
      # (.claude/rules/builds-and-releases.md). Read from go.mod so a Dependabot
      # bump of the module cannot leave the two apart.
      - name: Install the Wails CLI
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The runner image has no NSIS, and `wails build -nsis` only warns when
      # makensis is missing. Pinned, like every other tool here.
      - name: Install NSIS
        run: |
          choco install nsis --version=3.13.0 --yes --no-progress
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"

      # Nothing else stamps wails.json, and the Windows version info and the
      # installer read it. The installer's VIProductVersion takes digits and
      # dots only, which the numeric part is.
      - name: Stamp the product version
        run: |
          jq --arg v "$NUMERIC" '.info.productVersion = $v' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json

      # -s and -skipbindings: the frontend is built above and the bindings are
      # committed. The tag replaces the -dev in version.go. -nsis wraps the
      # exe in build/windows/installer/project.nsi's setup, installed for the
      # one user (no UAC prompt), which runs Microsoft's WebView2 bootstrapper
      # when the runtime is missing.
      - name: Build
        run: |
          makensis -VERSION
          wails build -platform windows/amd64 -trimpath -s -skipbindings \
            -nsis -installscope user -ldflags "-X main.Version=$TAG"

      - name: go.mod and go.sum are unchanged
        run: git diff --exit-code go.mod go.sum

      # The setup is what a player downloads; the bare exe beside it runs
      # without installing. A missing setup fails the copy, which is the check
      # that makensis ran.
      - name: Name the artefacts
        run: |
          mkdir out
          cp build/bin/kapital-launcher.exe "out/Kapital-Launcher-${TAG}-windows-amd64.exe"
          cp "build/bin/Kapital Launcher-amd64-installer.exe" "out/Kapital-Launcher-${TAG}-windows-amd64-setup.exe"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kapital-launcher-${{ env.TAG }}-windows-amd64
          path: out/*.exe
          retention-days: 14
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
      NUMERIC: ${{ needs.version.outputs.numeric }}
      # Wails hardcodes -mmacosx-version-min=10.13 in its cgo flags and lets
      # these override it. Go 1.26 and Prism 11 both need macOS 12, which is
      # also LSMinimumSystemVersion in build/darwin/*.plist. Setting the
      # variable replaces Go's default, -O2 -g, so that is written out too.
      CGO_CFLAGS: -O2 -g -mmacosx-version-min=12.0
      CGO_LDFLAGS: -mmacosx-version-min=12.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

      - name: Install the Wails CLI
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Feeds CFBundleVersion and CFBundleShortVersionString in the plist.
      - name: Stamp the product version
        run: |
          jq --arg v "$NUMERIC" '.info.productVersion = $v' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json

      # One bundle for Apple Silicon and Intel: the author's Mac is an Intel
      # iMac. Wails builds both halves and lipos them, ad-hoc signs the result
      # (`codesign --sign -`) and clears the quarantine attribute; there is no
      # Developer ID (ADR-6).
      - name: Build
        run: |
          wails build -platform darwin/universal -trimpath -s -skipbindings \
            -ldflags "-X main.Version=$TAG"

      - name: go.mod and go.sum are unchanged
        run: git diff --exit-code go.mod go.sum

      # The identifier is the app's identity on macOS, and the template's
      # com.wails.* would come back if the plist were ever regenerated.
      - name: The bundle carries its identifier
        run: |
          id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "build/bin/Kapital Launcher.app/Contents/Info.plist")"
          echo "$id"
          [ "$id" = "io.github.sandrogekeler.kapital-launcher" ]

      # The amd64 half is compiled with cgo on an arm64 runner, so check that
      # both halves made it in rather than trust the exit code.
      - name: The executable holds both architectures
        run: |
          archs="$(lipo -archs "build/bin/Kapital Launcher.app/Contents/MacOS/kapital-launcher")"
          echo "$archs"
          case "$archs" in
            *x86_64*arm64* | *arm64*x86_64*) ;;
            *) echo "::error::Expected x86_64 and arm64, got: $archs"; exit 1 ;;
          esac

      # A disk image with the bundle and a link to Applications: open it, drag
      # one onto the other. ditto copies the bundle whole (symlinks, modes,
      # the signature); the image is one file, so upload-artifact cannot
      # flatten the modes inside it. The bundle is named from wails.json's
      # `name`, hence the space. hdiutil now and then finds the volume busy on
      # a hosted runner, so it gets three tries.
      - name: Build the disk image
        run: |
          mkdir out dmg
          ditto "build/bin/Kapital Launcher.app" "dmg/Kapital Launcher.app"
          ln -s /Applications dmg/Applications
          dmg="out/Kapital-Launcher-${TAG}-macos-universal.dmg"
          for try in 1 2 3; do
            if hdiutil create -volname "Kapital Launcher" -srcfolder dmg -fs HFS+ -format UDZO -ov "$dmg"; then
              break
            fi
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
          hdiutil verify "$dmg"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kapital-launcher-${{ env.TAG }}-macos-universal
          path: out/*.dmg
          retention-days: 14
          if-no-files-found: error

  # The only job that can write, and the only one that runs the attestation:
  # the files are attested exactly as they are published.
  release:
    if: ${{ !inputs.dry_run }}
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kapital-launcher-*
          merge-multiple: true
          path: release

      # sha256sum's format, which `shasum -a 256 -c` reads too.
      - name: Write checksums.txt
        working-directory: release
        run: |
          sha256sum *.dmg *.exe > checksums.txt
          cat checksums.txt

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.dmg
            release/*.exe

      # The generator names what changed in the binary since the latest
      # published release. It exits non-zero when there is none to measure from,
      # which the first release is, and GitHub's own notes (laid out by
      # .github/release.yml) take over. Either way the fixed header leads.
      - name: Publish the release
        env:
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.sha }}
        run: |
          args=("$TAG" release/*.dmg release/*.exe release/checksums.txt
            --title "Kapital Launcher $TAG" --target "$GITHUB_SHA")
          case "$TAG" in
            *-*) args+=(--prerelease) ;;
          esac

          if python3 .github/scripts/release-notes.py > changelog.md; then
            cat .github/release-body.md changelog.md > notes.md
            args+=(--notes-file notes.md)
          else
            echo "::warning::release-notes.py produced no body; using GitHub's generated notes."
            args+=(--notes-file .github/release-body.md --generate-notes)
          fi

          gh release create "${args[@]}"
