name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # The coverage floor is a ratchet held in vite.config.ts; a separate step
      # so a floor failure and a test failure stay distinct.
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm check-bundle
      # A token-named class that compiles to nothing falls back to a Tailwind
      # default and looks fine in review. Needs the build above.
      - run: pnpm check-tokens

  # The download site (site/). It imports the app's generated tokens.css, fonts
  # and screenshots, so a change on the app side can break it; the build also
  # refuses a link that is not https. Deploys are Cloudflare's, not CI's.
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Release tooling never runs until a release is being cut, which is the
  # worst moment to find out it is wrong. The generator's tests are pure and
  # offline, so they run on every push instead.
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - run: python3 .github/scripts/release-notes_test.py

  # The Go gates run on both targets (ADR-7): Windows, and macOS on an Apple
  # Silicon runner. main.go embeds frontend/dist, so the frontend is built
  # first in each.
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

      - name: gofmt
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) {
            Write-Host "Not gofmt-formatted:"
            Write-Host $files
            exit 1
          }

      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

      # Reports only vulnerabilities whose symbols this code reaches. Pinned,
      # like agent_docs/SECURITY_CHECKLIST.md S7.4 says.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  backend-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # .claude/suite.json's invariants and generated sections, through the vendored
  # runner, so the greps and the clean-diff check run on every push and not only
  # when someone runs the health check by hand. `commands` is left out: the
  # jobs above already run each one on the platform it belongs to.
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The generated section runs `pnpm gen:tokens`, which needs node only,
      # but the runner resolves pnpm from the frontend's install.
      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - run: node scripts/validate-schemas.mjs

      # --require-runnable turns a skip into a failure: every check in these
      # sections can run here, so a skip means the setup above broke.
      - name: Invariants, generated files and memory budget
        run: ./.claude/suite-check.py --section invariants --section generated --section memory --require-runnable
