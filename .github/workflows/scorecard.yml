# Locked: comes from sandrogekeler/AllesSandro and is re-applied by every
# template update. Change it there, not here (AllesSandro docs/updating.md).
#
# OpenSSF Scorecard: scores the repo's supply-chain hygiene (pinned actions,
# token permissions, branch protection) and uploads the result to code scanning.
name: Scorecard

on:
  # Branch protection is one of the checks, and it is the one thing here that
  # can change without a commit. This trigger is how the score notices.
  branch_protection_rule:
  schedule:
    - cron: '30 5 * * 0'
  push:
    branches: [main]

# Read-only by default, and widened only on the job that needs it. Scorecard's
# own check for exactly this pattern is why the file is written this way.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Uploading the SARIF to the code-scanning dashboard, so findings sit
      # beside CodeQL's rather than only in a log.
      security-events: write
      # Publishing the result to the OpenSSF API, which is what the badge and
      # the public viewer read. Without it this runs privately and the badge has
      # nothing to show.
      id-token: write
      # Used by the Webhooks and Maintained checks.
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scorecard reads the tree; it never needs to write to the remote, and
          # leaving a token in .git/config for an analysis step is the kind of
          # thing it would flag on someone else's repository.
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # This is what makes the result public: the badge endpoint and the
          # viewer both read the published record, and setting it also replaces
          # OpenSSF's own weekly scan of the repository with this run.
          #
          # Publishing a score nobody has seen yet is the trade here, and it is
          # the right way round: an unflattering number that is honest is worth
          # more than a badge that only ever appears once it is flattering.
          publish_results: true

      # Kept for 5 days so a score that moves can be diffed against the previous
      # run without re-running the analysis.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
