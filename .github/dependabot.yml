# Dependency updates. agent_docs/DEPENDENCIES.md is the decision record for
# what may be added; this answers whether what is here is still current.
#
# Every update carries type:chore and area:build, the pair CONTRIBUTING.md's
# ladder gives a dependency bump, so pr-labelled passes without a hand edit.
# Setting labels replaces Dependabot's own (dependencies, the ecosystem).
#
# Grouped, so routine minor and patch traffic arrives as one pull request per
# ecosystem and only a major gets a pull request of its own. github-actions
# groups its majors too: bumping checkout or setup-node asks one question,
# does CI still pass, and the combined effect is what runs.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
    labels: ['type:chore', 'area:build']
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
        update-types: [major, minor, patch]
    ignore:
      # 6.1.0 installs pnpm 12 in a way that leaves pnpm a silent no-op on
      # the Windows runner: install and build exit 0 with no output and no
      # frontend/dist (#1). 6.0.10 self-updates to pnpm 12 and works. Only
      # this version is skipped, so a fixed release is still offered.
      - dependency-name: pnpm/action-setup
        versions: ['6.1.0']

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: sunday
    labels: ['type:chore', 'area:build']
    open-pull-requests-limit: 3
    groups:
      go:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # The app shell, not a library: a minor bump changes the generated
      # bindings and the webview it links against. Upgraded by hand (ADR-1).
      - dependency-name: github.com/wailsapp/wails/v2

  # Three npm projects: the root holds lefthook and nothing else.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
    labels: ['type:chore', 'area:build']
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: sunday
    labels: ['type:chore', 'area:build']
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Must move together, or the lockfile resolves to two vitest versions.
      - dependency-name: '@vitest/coverage-v8'
      - dependency-name: vitest
      # Held on 6.x until typescript-eslint supports 7 (DEPENDENCIES.md).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # The download site: Vite and Tailwind, neither of which ships.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: sunday
    labels: ['type:chore', 'area:build']
    open-pull-requests-limit: 2
    groups:
      site:
        patterns: ['*']
        update-types: [minor, patch]
